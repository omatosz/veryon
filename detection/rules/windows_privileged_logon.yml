title: Logon com privilégio administrativo
id: 45aed1d0-80c1-4f89-813a-596a1915b130
status: stable
description: >
  Um logon usou um token com privilégios especiais ou administrativos
  (Event ID 4672). Normal em uso rotineiro de uma estação de um usuário só,
  mas relevante como contexto de correlação num ambiente com vários usuários.
logsource:
  category: authentication
  product: windows
  service: security
detection:
  selection:
    event_type: windows.logon.privileged
  condition: selection
level: low
tags:
  - attack.privilege_escalation
  - attack.t1078
