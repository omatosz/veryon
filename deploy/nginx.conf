# Serve so arquivo estatico. Sem proxy pra API de proposito: painel e API ficam em
# origens separadas (ver deploy/README.md), o navegador chama a API direto pelo
# VITE_API_URL que foi gravado no build, e o CORS do backend e quem autoriza isso.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Arquivo com hash no nome (o Vite gera isso pra tudo em /assets) pode cachear
    # por muito tempo: o nome so muda quando o conteudo muda. So o add_header, sem
    # "expires": os dois escrevem Cache-Control, e juntos mandavam duas linhas do
    # mesmo cabecalho na resposta.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # SPA: qualquer caminho que nao seja um arquivo real cai no index.html, e o
    # react-router decide a tela a partir da URL. Sem isso, recarregar a pagina em
    # /alerts ou /users devolve 404 do proprio nginx antes do React entrar em cena.
    location / {
        try_files $uri /index.html;
    }
}
